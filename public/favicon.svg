<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0e1a22"/>
      <stop offset="100%" stop-color="#161025"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Outline ring picks up the brand gradient -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.65"/>
  <!-- "A" monogram in JetBrains-Mono-ish geometry -->
  <text x="32" y="46"
        text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
        font-weight="700"
        font-size="42"
        fill="#22d3ee">A</text>
  <!-- Status dot — top-right, matches the navbar wordmark dot -->
  <circle cx="49" cy="17" r="4" fill="#22d3ee"/>
  <circle cx="49" cy="17" r="6.5" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.35"/>
</svg>
